[project]
name = "fedguard"
version = "0.1.0"
description = "Privacy-Preserving Federated Anomaly Detection Platform"
authors = [
    { name = "Developer" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "PyJWT>=2.8.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "pydantic>=2.0.0",
    "email-validator>=2.0.0",
    "passlib[bcrypt]",
    "bcrypt<4.0.0",
    "boto3",
    "prometheus-client",
    "openai",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "flwr>=1.9.0",
    "mlflow>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend.app*", "ml.fedguard_ml*"]
exclude = ["frontend*", "docs*", "tests*", "infrastructure*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
